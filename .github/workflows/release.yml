# 自动构建 GitHub Release，并同步代码、Tag、Release 元数据及兼容附件到 Gitee。
name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布 tag；留空只构建、不发布'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.5'

jobs:
  check-version:
    name: Verify release version contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag, AppInfo and pubspec
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          app=$(grep -oP "static const version = '\K[^']+" lib/app/app_info.dart)
          pub=$(grep -oE '^version:\s*[^[:space:]]+' pubspec.yaml | awk '{print $2}')
          pub_version=${pub%%+*}
          build=${pub##*+}
          test "$app" = "$pub_version" || {
            echo "::error::AppInfo.version($app) 与 pubspec($pub_version) 不一致"
            exit 1
          }
          test "$build" -ge 1 -a "$build" -lt 1000 || {
            echo "::error::pubspec build number 必须在 1..999"
            exit 1
          }
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [[ "$tag" == v* ]]; then
            test "${tag#v}" = "$app" || {
              echo "::error::发布 tag(${tag#v}) 与 AppInfo.version($app) 不一致"
              exit 1
            }
          fi
          echo "version=$app build=$build universal=$((10000+build)) splitBase=$((10000+build))"

  build-android:
    name: Build verified Android APKs
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
      - run: flutter pub get
      - name: Build universal and ABI APKs
        shell: bash
        run: |
          set -euo pipefail
          pub=$(grep -oE '^version:\s*[^[:space:]]+' pubspec.yaml | awk '{print $2}')
          version=${pub%%+*}
          build=${pub##*+}
          base=$((10000+build))
          flutter build apk --release --build-name="$version" --build-number="$base"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/DreamMangaReader-android-universal.apk
          flutter build apk --release --split-per-abi --build-name="$version" --build-number="$base"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/DreamMangaReader-android-$abi.apk"
          done
      - name: Verify APK package, versionCode and certificate
        shell: bash
        run: |
          set -euo pipefail
          pub=$(grep -oE '^version:\s*[^[:space:]]+' pubspec.yaml | awk '{print $2}')
          version=${pub%%+*}
          build=${pub##*+}
          base=$((10000+build))
          tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          expected_cert=$(keytool -list -v -keystore android/app/dmr-release.jks -storepass dreammangareader -alias dmr | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | head -1)
          cert=''
          for apk in dist/*.apk; do
            line=$("$tools/aapt2" dump badging "$apk" | head -1)
            package=$(sed -n "s/.*name='\([^']*\)'.*/\1/p" <<<"$line")
            code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"$line")
            name=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$line")
            digest=$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            test "$package" = 'com.dreammoon.dream_manga_reader'
            test "$name" = "$version"
            if [[ "$apk" == *universal* ]]; then test "$code" -eq "$base"; else test "$code" -gt "$base"; fi
            test "$digest" = "$expected_cert"
            if [ -z "$cert" ]; then cert="$digest"; else test "$digest" = "$cert"; fi
            echo "$(basename "$apk") versionCode=$code cert=$digest"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: check-version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh -NoProfile -File {0}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Windows build tools
        shell: pwsh -NoProfile -File {0}
        run: choco install nuget.commandline innosetup --no-progress -y
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: Build Windows Release
        shell: pwsh -NoProfile -File {0}
        run: |
          $pub = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches.Groups[1].Value
          $parts = $pub.Split('+')
          flutter build windows --release --build-name=$($parts[0]) --build-number=$($parts[1])
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundle VC runtime, portable ZIP and installer
        shell: pwsh -NoProfile -File {0}
        run: |
          $pub = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches.Groups[1].Value
          $version = $pub.Split('+')[0]
          $rel = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$rel/dream_manga_reader.exe")) { throw "Windows output missing: $rel" }
          foreach ($dll in @('msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll')) {
            $source = Join-Path $env:SystemRoot "System32/$dll"
            if (!(Test-Path $source)) { throw "VC runtime missing: $dll" }
            Copy-Item $source $rel -Force
          }
          New-Item -ItemType Directory -Force dist,'staging/DreamMangaReader' | Out-Null
          Copy-Item "$rel/*" 'staging/DreamMangaReader/' -Recurse -Force
          Compress-Archive -LiteralPath 'staging/DreamMangaReader' -DestinationPath 'dist/DreamMangaReader-windows-x64.zip' -Force
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$((Resolve-Path $rel).Path)" "/DOutputDir=$((Resolve-Path dist).Path)" 'windows/installer/DreamMangaReader.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub bridge release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build release manifest and hashes
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          version=${tag#v}
          channel=stable
          prerelease=false
          if grep -qiE '(-beta|-rc|-alpha)' <<<"$version"; then channel=beta; prerelease=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          mkdir release-assets gitee-release-assets
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          cd release-assets
          for required in DreamMangaReader-windows-x64-setup.exe DreamMangaReader-windows-x64.zip DreamMangaReader-android-universal.apk DreamMangaReader-android-armeabi-v7a.apk DreamMangaReader-android-arm64-v8a.apk DreamMangaReader-android-x86_64.apk; do
            test -f "$required" || { echo "::error::missing $required"; exit 1; }
          done
          asset() {
            jq -n --arg platform "$1" --arg arch "$2" --arg kind installer --arg fileName "$3" --arg sha256 "$(sha256sum "$3" | awk '{print $1}')" --argjson sizeBytes "$(stat -c%s "$3")" '{platform:$platform,arch:$arch,kind:$kind,fileName:$fileName,sha256:$sha256,sizeBytes:$sizeBytes}'
          }
          assets=$(jq -s '.' < <(
            asset windows x64 DreamMangaReader-windows-x64-setup.exe
            asset android universal DreamMangaReader-android-universal.apk
            asset android armeabi-v7a DreamMangaReader-android-armeabi-v7a.apk
            asset android arm64-v8a DreamMangaReader-android-arm64-v8a.apk
            asset android x86_64 DreamMangaReader-android-x86_64.apk
          ))
          jq -n --arg version "$version" --arg channel "$channel" --argjson assets "$assets" '{schemaVersion:1,appId:"DreamMangaReader",version:$version,channel:$channel,assets:$assets}' > dream-manga-reader-update.json
          sha256sum DreamMangaReader-* dream-manga-reader-update.json > "DreamMangaReader-$tag-sha256.txt"
          cd ..
          for file in \
            DreamMangaReader-windows-x64-setup.exe \
            DreamMangaReader-windows-x64.zip \
            DreamMangaReader-android-armeabi-v7a.apk \
            DreamMangaReader-android-arm64-v8a.apk \
            DreamMangaReader-android-x86_64.apk; do
            cp "release-assets/$file" gitee-release-assets/
          done
          cd gitee-release-assets
          assets=$(jq -s '.' < <(
            asset windows x64 DreamMangaReader-windows-x64-setup.exe
            asset android armeabi-v7a DreamMangaReader-android-armeabi-v7a.apk
            asset android arm64-v8a DreamMangaReader-android-arm64-v8a.apk
            asset android x86_64 DreamMangaReader-android-x86_64.apk
          ))
          jq -n --arg version "$version" --arg channel "$channel" --argjson assets "$assets" '{schemaVersion:1,appId:"DreamMangaReader",version:$version,channel:$channel,assets:$assets}' > dream-manga-reader-update.json
          sha256sum DreamMangaReader-* dream-manga-reader-update.json > "DreamMangaReader-$tag-sha256.txt"
      - name: Upload Gitee-compatible release assets
        uses: actions/upload-artifact@v4
        with:
          name: gitee-release-assets
          path: gitee-release-assets/*
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DreamMangaReader ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  sync-gitee:
    name: Sync code and release to Gitee
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Gitee token
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Repository secret GITEE_TOKEN is required for Gitee synchronization."
            exit 1
          fi
      - name: Sync main and release tag
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid release tag: $tag"
            exit 1
          fi
          git fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          askpass="$RUNNER_TEMP/gitee-askpass.sh"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'TypeDreamMoon' ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0
          git remote add gitee 'https://gitee.com/TypeDreamMoon/DreamMangaReader.git'
          git push gitee \
            'refs/remotes/origin/main:refs/heads/main' \
            "refs/tags/$tag:refs/tags/$tag"
      - uses: actions/download-artifact@v4
        with:
          name: gitee-release-assets
          path: gitee-release-assets
      - name: Fetch finalized GitHub Release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/github-release.json"
      - name: Publish Gitee Release
        shell: pwsh -NoProfile -File {0}
        env:
          DREAMMANGAREADER_GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          ./Scripts/发布到Gitee.ps1 `
            -AssetRoot (Join-Path $env:GITHUB_WORKSPACE 'gitee-release-assets') `
            -ReleaseMetadataPath (Join-Path $env:RUNNER_TEMP 'github-release.json') `
            -ConfirmPublish
